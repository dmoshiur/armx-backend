#
# MQTT broker for ESP32 relay/fan nodes.
#
# Security posture:
#   * TLS-only listener (no plaintext 1883) with the deployment CA in deploy/certs/ca.crt
#   * anonymous access disabled; every client - including the backend - has its own credentials
#   * per-device topic ACLs in mosquitto/acl: a device may publish its own /state and subscribe
#     only to its own /cmd, so a compromised node cannot command its neighbours
#
# Create credentials (per device, one user each):
#   docker compose run --rm mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd armx-api "<password>"
#   docker compose run --rm mosquitto mosquitto_passwd -b /mosquitto/config/passwd esp32-livingroom "<password>"
# Then reload the broker. Rotate a device credential by re-running mosquitto_passwd and removing
# that device's row in the backend's device_keys table.

per_listener_settings true

listener 8883
protocol mqtt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Subscriptions/queries are capped so a misbehaving node cannot exhaust broker memory.
max_queued_messages 200
max_inflight_messages 20
message_size_limit 65536
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
