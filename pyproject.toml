[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armx-backend"
version = "0.1.0"
description = "A.R.M.X AI FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  # The asyncio DBAPI adapters in sqlalchemy.connectors.asyncio (2.1+) back the
  # sqlite+libsql dialect in app/db/libsql_async.py.
  "sqlalchemy[asyncio]>=2.1,<3",
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  # Official Turso/libSQL client. It is synchronous; app/db/libsql_async.py wraps it.
  "libsql>=0.1.11,<1",
  "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<48",
  "aiomqtt>=2.3,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
mypy_path = "."
