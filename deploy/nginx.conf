#
# TLS termination, WebSocket pass-through and an edge rate limit.
#
# Certificates: for a real deployment issue them with Certbot and reload nginx
#   certbot certonly --webroot -w /var/www/certbot -d api.example.com --deploy-hook "docker compose exec nginx nginx -s reload"
# and point the ssl_certificate paths at /etc/letsencrypt/live/<domain>/fullchain.pem and
# privkey.pem. For local development, generate a self-signed pair into deploy/certs/:
#   openssl req -x509 -nodes -newkey rsa:2048 -days 365 -keyout deploy/certs/server.key \
#     -out deploy/certs/server.crt -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"

# Edge rate limits. These complement (never replace) the per-actor limits the Security Gateway
# enforces in the database: nginx sheds obvious floods cheaply, the gateway enforces policy.
limit_req_zone $binary_remote_addr zone=armx_edge:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=armx_auth:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=armx_conn:10m;

upstream armx_api {
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Plain HTTP exists only to redirect to HTTPS and to answer the container health check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    client_max_body_size 16m;
    client_body_timeout 30s;
    keepalive_timeout 75s;

    limit_conn armx_conn 64;

    # Authentication endpoints get a tighter edge limit than the rest of the API.
    location ~ ^/(auth|v1/auth)/ {
        limit_req zone=armx_auth burst=10 nodelay;
        proxy_pass http://armx_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # WebSocket endpoint: upgrade headers, long read timeout, no request buffering.
    location /assistant/stream {
        limit_req zone=armx_edge burst=20 nodelay;
        proxy_pass http://armx_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=armx_edge burst=50 nodelay;
        proxy_pass http://armx_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /metrics {
        # Metrics are not for the public internet: allow only the private ranges that a
        # scraper runs in, then let the application enforce its own admin-token check.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://armx_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
